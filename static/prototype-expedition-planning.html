<!doctype html>
<!-- PROTOTYPE: Three variants of Expedition planning, switchable with ?variant=A|B|C. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype · Expedition planning</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f4eddc;color:#263b32;font:14px/1.45 Manrope,sans-serif}.bar{height:62px;display:flex;align-items:center;gap:24px;padding:0 6%;border-bottom:1px solid #bda979;background:#fff9eb}.brand{font:650 25px Fraunces,serif}.crumb{color:#64735e}.shell{max-width:1100px;margin:0 auto;padding:48px 28px 110px}.eyebrow{margin:0 0 6px;color:#7a6542;font:10px DM Mono,monospace;letter-spacing:.12em}.title{margin:0;font:650 clamp(2.2rem,5vw,4rem)/1 Fraunces,serif;letter-spacing:-.05em}.lede{max-width:670px;color:#596b5c}.plan{margin-top:30px}.setup{background:#e5eddc;border:1px solid #91a886;padding:20px}.setup h2,.ranked h2,.selected h2,.charter h2{margin:0;font:650 1.5rem Fraunces,serif}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:17px}.field{display:block;font-weight:700;font-size:12px}.field input{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #9bb08d;background:#fffdf6;font:14px Manrope}.lens{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.lens span{padding:7px 9px;border:1px solid #91a886;background:#f8fbed;font-size:12px}.hint{margin:14px 0 0;padding:10px;border-left:3px solid #4f764e;background:#f8fbed;color:#4a604c;font-size:12px}.layout-a{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.layout-b{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;border:1px solid #bca776;background:#fff9eb}.layout-c{display:grid;grid-template-columns:1fr 1fr;gap:20px}.ranked,.selected,.charter{margin-top:18px;padding:20px;border:1px solid #bca776;background:#fff9eb}.ranked header,.selected header{display:flex;align-items:end;justify-content:space-between;gap:15px}.ranked header p,.selected header p{margin:4px 0 0;color:#61705f;font-size:12px}.island{display:grid;grid-template-columns:33px 1fr auto;gap:12px;align-items:center;margin-top:10px;padding:13px;border:1px solid #d1c09a;background:#fffdf6}.island.top{border-color:#52734d;box-shadow:inset 3px 0 #52734d}.place{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#e3d6b7;font:700 11px DM Mono}.top .place{background:#52734d;color:#fff}.island b,.island small{display:block}.island small{color:#66745f;font-size:11px}.score{color:#60705e;font:11px DM Mono}.add,button{cursor:pointer;font:700 12px Manrope}.add{padding:8px 10px;border:1px solid #52734d;background:#eff5e7;color:#345a38}.add.selected{background:#52734d;color:#fff}.continue{width:100%;margin-top:15px;padding:13px;border:0;background:#3f6845;color:#fff;font-size:13px}.continue:disabled{opacity:.45}.selected{background:#f2e8cf}.selected-list{margin-top:14px}.chosen{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #cfbd98}.chosen:first-child{border-top:0}.chosen b{font:600 15px Fraunces,serif}.mini{margin-top:14px;color:#60705e;font-size:11px}.show-more{margin-top:12px;border:0;background:transparent;color:#3d6845;text-decoration:underline}.rail{padding:28px 20px;background:#315b45;color:#eaf0df}.rail h2{margin:5px 0 15px;font:500 25px Fraunces,serif}.rail-step{padding:12px 0;border-top:1px solid #66806a}.rail-step.active{color:#fff;font-weight:700}.stage{padding:28px}.stage .setup{margin:0}.layout-c .setup{margin-top:0}.state{position:fixed;right:18px;bottom:18px;max-width:340px;padding:10px 14px;border:1px solid #bda979;background:#fff9eb;box-shadow:0 5px 18px #5d4c2722;color:#52634e;font:11px DM Mono}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:99px;background:#263b32;color:#fff;box-shadow:0 6px 20px #0004;z-index:2}.switcher button{border:0;background:transparent;color:#fff;font-size:19px}.switcher a{color:#dce6ce;text-decoration:none}.phase{margin-top:18px;padding:20px;border:1px dashed #a99162;background:#fffcf3}.charter-row{padding:14px 0;border-top:1px solid #d2c09c}.charter-row:first-child{border-top:0}.charter-row textarea{width:100%;height:58px;margin-top:7px;padding:8px;border:1px solid #bca776;background:#fff;font:12px Manrope}@media(max-width:750px){.layout-a,.layout-b,.layout-c{display:block}.rail{display:flex;gap:10px;padding:14px;overflow:auto}.rail h2{display:none}.rail-step{border:0;white-space:nowrap}.setup-grid{grid-template-columns:1fr}.shell{padding:32px 16px 100px}}
</style></head><body><header class="bar"><div class="brand">Opportunity Atlas</div><div class="crumb">Map / Expedition planning</div></header><main class="shell"><p class="eyebrow">PROTOTYPE · EXPEDITION PLANNING</p><h1 class="title">Set your course, then choose who sails.</h1><p class="lede">This is a throwaway test of the new sequence: horizon and lens first; ranked shortlist second; Charters only after the team has chosen its set.</p><div id="app" class="plan"></div></main><div id="state" class="state"></div><nav class="switcher"><button id="prev">←</button><span id="variantLabel"></span><button id="next">→</button></nav><script>
const islands=[['triage','Support ticket signal triage','High value · ready data','5.0'],['renewal','Renewal preparation brief','Strong benefit · heavier delivery','3.4'],['gaps','Knowledge-base gap finder','Small first trial available','3.3'],['coach','Support quality coaching','Sensitive adoption question','3.0'],['voice','Voice of customer themes','Needs a common source format','2.9'],['onboard','Implementation onboarding guide','Evidence still thin','2.4'],['routing','Escalation routing assistant','Risk needs more work','2.1']];
const q=new URLSearchParams(location.search), variants=['A','B','C'];let variant=q.get('variant')||'A', selected=new Set(['triage']),more=false,phase='select',horizon='Next 6 weeks';
function choose(id){selected.has(id)?selected.delete(id):selected.add(id);render()}function setup(){return `<section class="setup"><p class="eyebrow">1 · SET THE PLANNING LENS</p><h2>What matters in this horizon?</h2><div class="setup-grid"><label class="field">Planning horizon<input value="${horizon}" oninput="horizon=this.value;state()"></label><div class="field">AI Compass suggestion<div class="lens"><span>Value 2</span><span>Readiness 3</span><span>Effort 2</span></div></div></div><p class="hint">For a six-week window, readiness is weighted higher: your North Star asks for accountable, practical progress. You can adjust this later.</p></section>`}function ranking(){let list=more?islands:islands.slice(0,5);return `<section class="ranked"><header><div><p class="eyebrow">2 · RANKED SHORTLIST</p><h2>What rises to the surface?</h2><p>The top Island starts selected. Add others only if they belong in this Expedition.</p></div><span class="score">${islands.length} ranked</span></header>${list.map(([id,name,detail,score],i)=>`<article class="island ${i===0?'top':''}"><span class="place">${i+1}</span><div><b>${name}</b><small>${detail}</small></div><div><span class="score">${score}</span><button class="add ${selected.has(id)?'selected':''}" onclick="choose('${id}')">${selected.has(id)?'Selected':'Add'}</button></div></article>`).join('')}${!more?`<button class="show-more" onclick="more=true;render()">Show more ranked Islands</button>`:''}<button class="continue" ${selected.size?'':'disabled'} onclick="phase='charter';render()">Continue with ${selected.size} selected Island${selected.size===1?'':'s'} →</button></section>`}function selection(){return `<aside class="selected"><header><div><p class="eyebrow">YOUR SELECTED SET</p><h2>${selected.size} Island${selected.size===1?'':'s'} aboard</h2></div></header><div class="selected-list">${[...selected].map(id=>{let x=islands.find(i=>i[0]===id);return `<div class="chosen"><b>${x[1]}</b><button class="show-more" onclick="choose('${id}')">Remove</button></div>`}).join('')}</div><p class="mini">Selections stay put if the lens or Map changes. A new top-ranked Island would be surfaced, never silently substituted.</p></aside>`}function charters(){return `<section class="phase"><p class="eyebrow">3 · CHARTER DETAILS</p><h2>Give each chosen Island its first learning move.</h2>${[...selected].map(id=>{let x=islands.find(i=>i[0]===id);return `<div class="charter-row"><b>${x[1]}</b><textarea placeholder="Next learning action…"></textarea></div>`}).join('')}<button class="continue" onclick="phase='select';render()">← Back to selected set</button></section>`}function render(){let content=phase==='charter'?charters():ranking();if(variant==='A')app.innerHTML=setup()+`<div class="layout-a">${content}${selection()}</div>`;if(variant==='B')app.innerHTML=`<div class="layout-b"><aside class="rail"><h2>Expedition planning</h2><div class="rail-step active">1. Set lens</div><div class="rail-step active">2. Choose Islands</div><div class="rail-step">3. Charter details</div></aside><div class="stage">${setup()}${content}</div></div>`;if(variant==='C')app.innerHTML=`<div class="layout-c"><div>${setup()}${selection()}</div><div>${content}</div></div>`;variantLabel.innerHTML=`${variant} — ${variant==='A'?'Guided selection':variant==='B'?'Journey rail':'Planning board'}`;state()}function state(){document.querySelector('#state').textContent=`STATE · horizon: ${horizon} · selected: ${[...selected].join(', ')} · phase: ${phase}`;let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u)}function cycle(n){variant=variants[(variants.indexOf(variant)+n+3)%3];render()}prev.onclick=()=>cycle(-1);next.onclick=()=>cycle(1);addEventListener('keydown',e=>{if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&e.key==='ArrowLeft')cycle(-1);if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
